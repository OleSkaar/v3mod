[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v3mod-errors"
version = "0.1.0"
description = "error.log filtering and vanilla-baseline diffing for Victoria 3 mods (v3mod add-on)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["v3mod>=0.8"]

[project.scripts]
v3mod-errors = "v3mod_errors.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["v3mod_errors*"]
